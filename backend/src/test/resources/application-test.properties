# In-memory database for security and isolation tests. DatabaseConfig and
# DataInitializer are annotated @Profile("!test") so neither is active here.
spring.datasource.url=jdbc:h2:mem:adatya_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop

# The migrations are PostgreSQL-specific; tests build the schema from the
# entities instead. Migrations are exercised against real PostgreSQL.
spring.flyway.enabled=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test-only signing key (>= 32 bytes).
security.jwt.secret=adatya-test-signing-secret-value-0123456789
security.jwt.ttl-minutes=60

# No seed administrator during tests.
admin.default.mobile=
admin.default.password=

cors.allowed-origins=http://localhost:5173
