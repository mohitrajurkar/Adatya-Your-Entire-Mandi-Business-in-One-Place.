# =============================================================================
# Adatya production web server: HTTPS, with HTTP kept only for redirection
# and for the ACME challenge.
#
# The development nginx.conf listens on port 80 alone. Adatya authenticates
# with a JWT that the browser sends on every request, so serving it over plain
# HTTP on the public internet would let anyone on the same network read that
# token and take over a trader's account. This config is what the EC2 host
# uses; nginx.conf stays as it is for local work.
#
# ${DOMAIN} is substituted by Docker's envsubst at container start, so the
# same file works for any domain without editing.
# =============================================================================

# ---------------------------------------------------------------------------
# Port 80: redirect everything to HTTPS, except the ACME challenge that
# Let's Encrypt fetches over HTTP to prove you control the domain.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # The load balancer health check should not be redirected.
    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Port 443: the application.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # TLS 1.2 and 1.3 only. Older versions have known weaknesses.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security headers ---------------------------------------------------
    # Tells browsers never to use plain HTTP for this host again. Only safe
    # once HTTPS is confirmed working, which is why the deploy steps verify
    # the certificate before this config goes live.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The app is self-contained apart from Google Fonts. 'unsafe-inline' for
    # styles is required by the CSS-in-JS the UI libraries emit.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # --- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json
               application/javascript application/x-javascript application/xml
               application/xml+rss image/svg+xml;

    location /healthz {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # --- API ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The login rate limiter reads this to identify the caller, and the
        # backend must know the original scheme was HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 25M;
    }

    # --- Operational endpoints ---------------------------------------------
    # Only the health probe is public; everything else under /actuator
    # requires SUPER_ADMIN, enforced by the backend.
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Static assets ------------------------------------------------------
    # The service worker must never be cached, or an update never reaches a
    # trader's phone.
    location ~* (sw\.js|registerSW\.js|manifest\.webmanifest|manifest\.json)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Build output is content-hashed, so it can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
