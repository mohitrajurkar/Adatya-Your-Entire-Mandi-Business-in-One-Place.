name: Adatya CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Tests gate the builds. The pipeline previously ran `mvn package -DskipTests`
# and a bare `tsc --noEmit`, so nothing verified behaviour before an artifact
# was produced; the security and financial-integrity suites protected nothing.
jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Authentication, tenant isolation, destructive endpoints, financial
      # integrity and idempotency. These run on H2 and need no services.
      - name: Run backend test suite
        run: mvn -f backend/pom.xml -B clean test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend-check:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm --prefix frontend ci

      - name: TypeScript verification
        run: npm --prefix frontend run lint

  # ---------------------------------------------------------------------------
  # Builds only run once the checks above have passed.
  # ---------------------------------------------------------------------------
  backend-build:
    name: Backend build
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # Tests already ran in backend-test; skipping them here avoids paying
      # for the same suite twice.
      - name: Build Spring Boot JAR
        run: mvn -f backend/pom.xml clean package -DskipTests -B

  frontend-build:
    name: Frontend build
    needs: frontend-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm --prefix frontend ci

      - name: Build production assets
        run: npm --prefix frontend run build

  # Proves the deployment path itself still works, which nothing checked before.
  docker-build:
    name: Docker images
    needs: [ backend-build, frontend-build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t adatya-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t adatya-frontend:ci -f frontend/Dockerfile .
